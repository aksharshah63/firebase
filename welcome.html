<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wecome Page</title>
    <link rel="stylesheet" href="./index.css" />
    <link
    href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
    rel="stylesheet"
    />
    <link
    href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/3.5.0/mdb.min.css"
    rel="stylesheet"
    />
    <script
    type="text/javascript"
    src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/3.5.0/mdb.min.js"
    ></script>
</head>
<body>
    <center><div style="margin:100px">
        <span class="message" id="user">Hello, < email-id ></span>
        <div class="success"><span>Welcome to auth starter, You are successfully loged in!!!</span></div><br/>
        <button class="btn btn-danger" id="logout">Logout</button>
        <section class="card mt-4 p-4" aria-labelledby="database-heading">
            <h2 id="database-heading">Your database data</h2>
            <form id="user-data-form">
                <label class="custom-field">
                    <input type="text" class="input" required id="name" />
                    <span class="placeholder">Name</span>
                </label><br />
                <label class="custom-field">
                    <input type="number" class="input" required min="0" step="1" id="age" />
                    <span class="placeholder">Age</span>
                </label><br /><br />
                <button type="button" class="btn btn-primary" id="set-data">Set profile</button>
                <button type="button" class="btn btn-secondary" id="update-data">Update profile</button>
                <button type="button" class="btn btn-info" id="push-data">Push entry</button>
                <button type="button" class="btn btn-warning" id="transaction-data">Increment transaction</button>
                <button type="button" class="btn btn-danger" id="remove-data">Remove latest pushed entry</button>
            </form>
            <p id="database-status" role="status" aria-live="polite"></p>
            <pre id="database-data" aria-live="polite"></pre>
        </section>
    </div></center>
    <script type="module" src="./welcome.js"></script>
</body>
</html>
